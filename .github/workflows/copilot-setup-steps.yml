name: Check Tests

on:
  push:
    branches: [ main ]

jobs:
  check-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check for Python tests
        run: |
          ls -la tests/
          ls -la *_test.py

      - name: Check for Node.js tests
        run: |
          cat package.json | grep -A 5 '"test"'
          ls -la __tests__/ test/

      - name: Check for Go tests
        run: |
          ls -la *_test.go
