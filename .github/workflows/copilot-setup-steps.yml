name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Detect Python tests
        id: python
        run: |
          shopt -s nullglob
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -d tests ] || ls *_test.py 1>/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Node tests
        id: node
        run: |
          if [ -f package.json ] && node -p "require('./package.json').scripts && require('./package.json').scripts.test" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Go tests
        id: go
        run: |
          shopt -s nullglob
          if ls *_test.go 1>/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.python.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: steps.python.outputs.enabled == 'true'
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          fi

      - name: Run Python tests
        if: steps.python.outputs.enabled == 'true'
        run: |
          if [ -d tests ]; then
            python -m pytest tests -v
          else
            python -m pytest *_test.py -v
          fi

      - name: Set up Node.js
        if: steps.node.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        if: steps.node.outputs.enabled == 'true'
        run: npm install

      - name: Run Node.js tests
        if: steps.node.outputs.enabled == 'true'
        run: npm test

      - name: Set up Go
        if: steps.go.outputs.enabled == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Go tests
        if: steps.go.outputs.enabled == 'true'
        run: go test ./... -v
